name: home-exchange-server

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_exchange
      POSTGRES_USER: home_exchange
      POSTGRES_PASSWORD: home_exchange
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U home_exchange -d home_exchange']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
