name: home-exchange-server

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_exchange
      POSTGRES_USER: home_exchange
      POSTGRES_PASSWORD: home_exchange
      TZ: UTC
    ports:
      - '5432:5432'
    # PostgreSQL 18+ 官方镜像改了数据目录约定：挂载整个 /var/lib/postgresql（而不是
    # 旧版的 /var/lib/postgresql/data），镜像内部会自动按版本号分子目录存放数据。
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U home_exchange -d home_exchange']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
